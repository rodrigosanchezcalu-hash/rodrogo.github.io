<!-- Local Audio File -->
  <audio id="bg-music" loop preload="auto">
    <source src="harrypotter.mp3" type="audio/mpeg">
  </audio>

  <script>
    // URL Parameter Customization (?name=Her)
    const urlParams = new URLSearchParams(window.location.search);
    const witchName = urlParams.get('name') || 'Beautiful Witch';
    document.getElementById('witch-name').innerText = witchName;

    const targetPhone = '34624302215';

    // CONTROLES DE AUDIO
    const bgMusic = document.getElementById('bg-music');
    const audioToggle = document.getElementById('audio-toggle');
    const audioIcon = document.getElementById('audio-icon');
    const audioText = document.getElementById('audio-text');
    let isPlaying = false;

    // Cargar el audio
    bgMusic.load();

    function playAudio() {
      bgMusic.volume = 0.7;
      const playPromise = bgMusic.play();
      if (playPromise !== undefined) {
        playPromise.then(() => {
          isPlaying = true;
          if (audioIcon) audioIcon.innerText = '🎶';
          if (audioText) audioText.innerText = 'Music On';
        }).catch(err => {
          console.log("Audio play blocked:", err);
        });
      }
    }

    function pauseAudio() {
      bgMusic.pause();
      isPlaying = false;
      if (audioIcon) audioIcon.innerText = '⚡';
      if (audioText) audioText.innerText = 'Music Off';
    }

    function toggleAudio() {
      if (isPlaying) {
        pauseAudio();
      } else {
        playAudio();
      }
    }

    // Abrir carta y reproducir sonido inmediatamente al hacer clic
    function openLetter() {
      playAudio();

      const envelopeWrapper = document.getElementById('envelope-wrapper');
      const letter = document.getElementById('letter');

      envelopeWrapper.classList.add('open');
      
      setTimeout(() => {
        envelopeWrapper.style.display = 'none';
        letter.style.display = 'block';
      }, 700);
    }

    // Botón evasivo "No"
    const noBtn = document.getElementById('no-btn');
    const spells = [
      "⚡ Obliviate!", 
      "🪄 Accio YES!", 
      "✨ Evanesco!", 
      "🦉 Try Again!", 
      "📜 No Entry!", 
      "🔮 Imperio!"
    ];

    function moveNoButton() {
      const btnContainer = document.getElementById('btn-container');
      const containerRect = btnContainer.getBoundingClientRect();
      const btnRect = noBtn.getBoundingClientRect();

      const maxX = containerRect.width - btnRect.width;
      const maxY = 150; 

      const randomX = Math.floor(Math.random() * maxX);
      const randomY = Math.floor(Math.random() * maxY) - 50;

      noBtn.style.position = 'absolute';
      noBtn.style.left = `${randomX}px`;
      noBtn.style.top = `${randomY}px`;

      const randomSpell = spells[Math.floor(Math.random() * spells.length)];
      noBtn.innerText = randomSpell;
    }

    if (noBtn) {
      noBtn.addEventListener('mouseenter', moveNoButton);
      noBtn.addEventListener('touchstart', function(e) {
        e.preventDefault();
        moveNoButton();
      });
    }

    // Aceptar invitación
    function acceptInvitation() {
      const cuisine = document.getElementById('cuisine').value;
      const availability = document.getElementById('availability').value;

      document.getElementById('res-cuisine').innerText = cuisine;
      document.getElementById('res-time').innerText = availability;

      const message = `Hello! 🪄 I accept your magical dinner invitation!\n\n🍲 Feast: ${cuisine}\n📅 Time: ${availability}\n\nSee you soon! ✨`;
      const encodedMsg = encodeURIComponent(message);
      
      const whatsappUrl = `https://wa.me/${targetPhone}?text=${encodedMsg}`;
      document.getElementById('whatsapp-link').href = whatsappUrl;

      document.getElementById('letter').style.display = 'none';
      document.getElementById('success-card').style.display = 'block';

      launchConfetti();
    }

    // Confeti
    function launchConfetti() {
      const duration = 3 * 1000;
      const end = Date.now() + duration;

      (function frame() {
        confetti({
          particleCount: 4,
          angle: 60,
          spread: 55,
          origin: { x: 0 },
          colors: ['#d4af37', '#740001', '#ffffff']
        });
        confetti({
          particleCount: 4,
          angle: 120,
          spread: 55,
          origin: { x: 1 },
          colors: ['#d4af37', '#740001', '#ffffff']
        });

        if (Date.now() < end) {
          requestAnimationFrame(frame);
        }
      })();
    }

    // Fondo de estrellas
    const canvas = document.getElementById('stars-canvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    const stars = Array.from({ length: 60 }, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      radius: Math.random() * 1.8,
      alpha: Math.random(),
      speed: Math.random() * 0.02 + 0.005
    }));

    function drawStars() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      stars.forEach(star => {
        star.alpha += star.speed;
        if (star.alpha > 1 || star.alpha < 0) star.speed = -star.speed;

        ctx.beginPath();
        ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(212, 175, 55, ${Math.abs(star.alpha)})`;
        ctx.fill();
      });
      requestAnimationFrame(drawStars);
    }
    drawStars();
  </script>
